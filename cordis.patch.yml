- insert:
    - id: dsh-mesh
      name: '@local/dsh-mesh'
      config:
        # Optional: the public gate URL. Empty means "same origin".
        gateUrl: ''
        # Host-side member discovery cache.
        discoveryCacheMs: 10000
        # Ports probed when DSH is opened directly (the gate has its own list).
        memberPorts:
          - 80
          - 8080
        # Member-to-member DSH interop HTTP service. The listener runs inside
        # this DSH Web process (the host plugin owns :8765) so task sessions are
        # owned by the same process the Web UI lists. Set false only to fall
        # back to the standalone code/interop-service.
        interopEmbedded: true
        interopPort: 8765
        # Empty: use DSH_INTEROP_TOKEN, DSH_GATE_PASSWORD, or config/gate.env.
        interopToken: ''
        # Reuse the gateway password when no explicit interopToken exists.
        interopUseGatePassword: true
        # Country of each member's public WireGuard endpoint. The panel uses it
        # to preselect a foreign outbound proxy; false disables the lookups.
        geo:
          enabled: true
          # Empty: ipwho.is. Must contain {ip}.
          provider: ''
        # Build defaults. Empty source means build/recipes.json's fixed upstream.
        build:
          source: ''
          ref: 'master'
          targets:
            - linux-x64
            - win-x64
          # 成员编译完成后是否把部署包拉回网关的 ~/.dsh/packages。
          # 默认 false：包留在编译机的 ~/.dsh/mesh/upgrade/<job>/ 下，直接用于
          # 编译后的自动升级，避免几百 MiB 再穿过一次 WireGuard。面板「拉回服务」
          # 开关可对单次编译覆盖这个默认值。
          pullBack: false
          # 成员编译成功后，自动用这份包在该成员上走升级流程（独立的升级进程，
          # 重启成员不会打断升级）。本机编译不自动升级。设 false 关闭。
          autoUpgrade: true
          # true: app/ + runtime/node/ + gate + plugin (offline package).
          # false: web/ + gate + plugin only.
          full: true
          # Empty: use the Node version running this DSH.
          nodeVersion: ''
